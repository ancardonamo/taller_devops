name: Paso 7 - Desplegar monitoreo en EC2

on:
  push:
    branches: [main]
    paths:
      - 'monitoring/**'
  workflow_dispatch:

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: SSH a EC2, git pull y docker compose (prometheus + grafana)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/taller_devops
            git pull origin main
            sudo docker compose up -d --force-recreate --no-deps prometheus grafana
            sudo docker compose ps
